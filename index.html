<!DOCTYPE html>
<html lang="en" data-theme="wedding-suite" style="--tp-h: 130">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BKR Catering — South Indian Wedding & Event Catering, Anaimalai</title>
    <meta
      name="description"
      content="BKR Catering plans and serves South Indian wedding and event menus across Anaimalai, Pollachi and Coimbatore. Choose your dishes session by session and receive the finished menu in English and Tamil."
    />
    <meta name="author" content="BKR Catering" />
    <meta
      name="keywords"
      content="catering, South Indian, Tamil Nadu, Anaimalai, Pollachi, Coimbatore, wedding catering, event catering, traditional food"
    />

    <meta
      property="og:title"
      content="BKR Catering — South Indian Wedding & Event Catering"
    />
    <meta
      property="og:description"
      content="Compose the menu for every session of your celebration, then receive it as a finished English and Tamil menu."
    />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />

    <!-- Theme Pack 164 typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Hanken+Grotesk:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
    />

    <script>
      // Resolve the paper before first paint: explicit choice wins, otherwise the
      // visitor's system preference. Prevents a flash of the wrong variant.
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;
          var useDark = saved ? saved === "dark" : prefersDark;
          if (useDark) {
            document.documentElement.classList.add("dark");
          }
        } catch (error) {
          /* storage unavailable - stay on the light paper */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
