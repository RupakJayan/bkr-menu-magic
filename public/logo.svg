<svg width="300" height="80" viewBox="0 0 300 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Brown circle background for mascot -->
  <circle cx="40" cy="40" r="28" fill="#5C2E1F"/>
  
  <!-- Yellow band/hat -->
  <ellipse cx="40" cy="28" rx="30" ry="8" fill="#F59E0B"/>
  
  <!-- Face (simplified) -->
  <circle cx="35" cy="38" r="3" fill="white"/>
  <circle cx="45" cy="38" r="3" fill="white"/>
  <path d="M 30 48 Q 40 52 50 48" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Orange accent lines -->
  <line x1="25" y1="55" x2="30" y2="60" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <line x1="55" y1="55" x2="50" y2="60" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  
  <!-- BKR Text -->
  <text x="85" y="35" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#5C2E1F">BKR</text>
  
  <!-- CATERING Text -->
  <text x="85" y="55" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#DC2626">CATERING</text>
  
  <!-- Anaimalai's text (smaller) -->
  <text x="200" y="25" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Anaimalai's</text>
</svg>
